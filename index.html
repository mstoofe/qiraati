<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قراءتي التفاعلية</title>
<meta name="theme-color" content="#bfe3f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قراءتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one-screen game — sky ground; each screen = HUD bar + stage; stage scales from phone (one thumb) to classroom board */
:root{
  color-scheme: light;
  --sky:#bfe3f3;
  --sky-deep:#8ccbe6;
  --paper:#fffdf5;
  --ink:#1d2b45;
  --ink-soft:#5a6782;
  --pink:#e2367a;   --pink-d:#a51f55;
  --leaf:#2f9e62;   --leaf-d:#1f6e43;
  --sun:#f7b731;    --sun-d:#c98f12;
  --sand:#f3d9a4;
  --water:#3f9fde;
  --line:#c9dbe6;
  --hint:#ffe58a;
  --display:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --read:"Noto Naskh Arabic","Traditional Arabic",Arial,serif;
  --big:clamp(1.2rem,1rem + 1.3vw,2.1rem);
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--display);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.ico{width:26px;height:26px;display:block}
.rb{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--sky-deep);flex:none;position:relative}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-deep)}
.btn3d{background:var(--sun);color:var(--ink);font-weight:800;font-size:var(--big);padding:.3em 1.4em .45em;border-radius:999px;box-shadow:0 6px 0 var(--sun-d);display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn3d:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-d)}
.btn3d.green{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-d)}
.btn3d.small{font-size:1.05rem}
.btn3d .ico{width:1em;height:1em}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding-block:10px 8px}
.hud h2{flex:1;min-width:0;margin:0;font-size:clamp(1.05rem,.9rem + 1vw,1.6rem);font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starpill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-size:1.2rem;box-shadow:0 4px 0 var(--sky-deep);font-variant-numeric:tabular-nums;flex:none}
.starpill svg{width:24px;height:24px}
.starpill.bump{animation:bump .5s}
.avbtn{overflow:hidden;padding:0}
.avbtn svg{width:48px;height:48px}

/* title */
#sTitle{align-items:center;justify-content:center;gap:4px;text-align:center;overflow-y:auto;padding-block:12px}
.logo{font-size:clamp(3.6rem,10vw + 1rem,7rem);font-weight:800;color:var(--pink);line-height:1;margin:0;text-shadow:0 5px 0 #fff}
.sub{font-family:var(--read);font-weight:700;font-size:clamp(1.15rem,1rem + 1vw,1.7rem);margin:0}
.ribbon{background:var(--ink);color:#fff;font-weight:700;padding:2px 18px 6px;border-radius:999px;font-size:clamp(1rem,.9rem + .6vw,1.3rem)}
.title-art{width:min(420px,88vw);aspect-ratio:2/1;position:relative;margin-block:6px}
.title-art .heroes{position:absolute;right:0;bottom:0;display:flex;height:92%}
.title-art .heroes svg{height:100%;width:auto}
.title-art .tcrow{position:absolute;left:0;bottom:0;width:58%}
.fine{color:var(--ink-soft);font-size:.9rem;margin:6px 0 0}

/* hero choose */
#sHero{align-items:center;justify-content:center;gap:18px;padding-block:16px;overflow-y:auto}
#sHero h1{margin:0;font-size:clamp(1.8rem,1.4rem + 2vw,3rem);font-weight:800}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(560px,100%)}
.pick{background:var(--paper);border-radius:28px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 var(--sky-deep);font-weight:800;font-size:var(--big);border:4px solid transparent}
.pick svg{height:clamp(150px,30vh,260px);width:auto}
.pick:hover,.pick:focus-visible{border-color:var(--sun)}
.pick:active{transform:translateY(4px);box-shadow:0 3px 0 var(--sky-deep)}

/* world */
#worldScroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:26px 26px 0 0;background:linear-gradient(#d6efe0,#c3e7cf 30%,#f2deb0 55%,#cfe9f5 80%,#d9d2ef)}
.world{position:relative;max-width:560px;margin:0 auto}
.world svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.zone{position:absolute;width:132px;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.zone .disc{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 7px 0 #00000022;display:grid;place-items:center;overflow:hidden;border:5px solid #fff;position:relative}
.zone .disc svg{width:100%;height:100%}
.zone .nm{font-weight:800;font-size:1rem;line-height:1.3;background:#ffffffd9;border-radius:12px;padding:0 10px 3px}
.zone .num{position:absolute;top:-6px;right:-2px;width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:800;box-shadow:0 3px 0 var(--sun-d);z-index:2}
.zone.soon .disc{filter:grayscale(.85) opacity(.7)}
.zone.soon .tag{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.zone.live .disc{border-color:var(--leaf);animation:breathe 2.2s ease-in-out infinite}
.zone.live .tag{background:var(--leaf);color:#fff;border-radius:999px;padding:0 12px 3px;font-weight:800;font-size:.9rem}
.zone .done-badge{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:var(--sun);border-radius:999px;padding:0 8px 2px;font-size:.72rem;font-weight:800;white-space:nowrap}
.walker{position:absolute;width:62px;height:93px;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:5;pointer-events:none}
.walker svg{width:100%;height:100%}
.walker.walking svg{animation:walk .25s ease-in-out infinite alternate}

/* hub */
#sHub .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;overflow-y:auto}
@media (min-width:900px) and (orientation:landscape){#sHub .stage{display:grid;grid-template-columns:1.35fr 1fr;align-items:center;overflow:hidden}}
.scenebox{position:relative;width:100%;max-width:min(760px,calc((100vh - 300px) * 1.6));min-width:min(100%,290px);margin:0 auto;flex:none}
@media (min-width:900px) and (orientation:landscape){.scenebox{max-width:calc((100vh - 110px) * 1.6)}}
.scene{width:100%;border-radius:22px;overflow:hidden;background:#cfeaf6;aspect-ratio:16/10;box-shadow:0 6px 0 var(--sky-deep)}
.scene svg{display:block;width:100%;height:100%}
.scenebox .hero-on{position:absolute;right:3%;bottom:4%;height:52%;pointer-events:none}
.scenebox .hero-on svg{height:100%;width:auto}
.sub-line{position:absolute;left:3%;right:3%;bottom:4%;background:#ffffffee;border-radius:16px;padding:4px 14px 8px;font-family:var(--read);font-weight:700;font-size:clamp(1.05rem,.9rem + 1vw,1.7rem);line-height:1.8;text-align:center;box-shadow:0 4px 0 #00000018}
.skip{position:absolute;top:10px;left:10px;background:#ffffffdd;border-radius:999px;padding:2px 14px 5px;font-weight:800}
.panel{display:flex;flex-direction:column;gap:12px;align-items:center}
.jarmeter{display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--sky-deep)}
.jarmeter i{width:18px;height:18px;border-radius:50%;background:#e6edf2;border:2px dashed #b9c7d2}
.jarmeter i.in{background:#9da4ab;border:2px solid #6b7177}
.jarmeter b{font-size:1.1rem;margin-inline-start:6px;font-variant-numeric:tabular-nums}
.trail{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding-bottom:18px}
.tok{width:clamp(50px,4vw + 30px,70px);height:clamp(50px,4vw + 30px,70px);border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--sky-deep);position:relative}
.tok svg{width:60%;height:60%}
.tok.cleared{background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.tok.next{outline:4px solid var(--pink);animation:breathe 1.6s ease-in-out infinite}
.tok small{position:absolute;top:calc(100% + 6px);font-size:.72rem;font-weight:800;white-space:nowrap;color:var(--ink-soft)}
@media (max-width:640px){.tok small{display:none}.trail{padding-bottom:0}}
.tray{display:flex;gap:12px;align-items:center;justify-content:center;min-height:64px;flex-wrap:wrap;background:#fff7e2;border:3px dashed #e6c98d;border-radius:20px;padding:8px 16px}
.tray .msg{font-weight:800;font-size:clamp(1rem,.9rem + .5vw,1.3rem);color:#8a6a1c;width:100%;text-align:center}
.peb{width:54px;height:46px;touch-action:none;cursor:grab;filter:drop-shadow(0 4px 0 #00000025);animation:wiggle 1.4s ease-in-out infinite}
.peb svg{width:100%;height:100%}
.flypeb{position:fixed;width:40px;height:34px;z-index:70;pointer-events:none}
.flypeb svg{width:100%;height:100%}

/* scene animation */
.scene .crow{transition:transform .9s cubic-bezier(.4,1.4,.5,1);transform:translate(88px,184px)}
.scene .water{transition:transform 1s ease}
.scene .pebs circle{transition:opacity .3s}
.scene .beakpeb,.scene .q,.scene .idea,.scene .spark{opacity:0;transition:opacity .4s}
.scene svg[data-beak="1"] .beakpeb,.scene svg[data-q="1"] .q,.scene svg[data-idea="1"] .idea{opacity:1}
.scene svg[data-pose="try"] .crow{transform:translate(132px,184px) rotate(14deg)}
.scene svg[data-pose="drink"] .crow{transform:translate(150px,60px) rotate(52deg) scale(.74)}
.scene svg[data-pose="happy"] .spark{opacity:1}
.scene svg.cheer .crow-body{animation:hop .3s ease-in-out 4 alternate}
.scene svg[data-pose="happy"] .crow-body{animation:hop .35s ease-in-out infinite alternate}
.scene.still *{transition:none!important;animation:none!important}

/* play (challenge) */
.playtop{display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.instr{flex:1;min-width:0;background:#fff;border-radius:18px;padding:4px 14px 8px;font-family:var(--read);font-weight:700;font-size:clamp(1rem,.85rem + .9vw,1.6rem);line-height:1.7;text-align:center;box-shadow:0 4px 0 var(--sky-deep)}
.instr .tag{display:inline-block;background:var(--pink);color:#fff;font-family:var(--display);font-size:.72em;font-weight:700;padding:0 10px 2px;border-radius:999px;margin-inline-end:6px;vertical-align:middle}
.bar{height:12px;background:#ffffff99;border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),#56c98a);border-radius:99px;transition:width .5s}
.arena{flex:1;min-height:0;position:relative;background:var(--paper);border-radius:26px;box-shadow:0 6px 0 var(--sky-deep);overflow:hidden;margin-bottom:12px;display:flex;flex-direction:column}
.arena .in{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:safe center}
.mini-av{width:48px;height:48px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 4px 0 var(--sky-deep);flex:none}
.mini-av svg{width:100%;height:100%}
.mini-av.jump{animation:jump .5s}

.qtext{font-family:var(--read);font-weight:700;font-size:clamp(1.3rem,1rem + 1.6vw,2.4rem);text-align:center;margin:0;line-height:1.8;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.speak{width:42px;height:42px;border-radius:50%;background:#eef6fb;display:inline-grid;place-items:center;flex:none}
.speak .ico{width:22px;height:22px}
.bubbles{display:grid;gap:14px;width:min(900px,100%);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.bubble{position:relative;background:#fff;border:4px solid var(--line);border-radius:28px;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--read);font-weight:700;font-size:clamp(1.2rem,1rem + 1.1vw,2rem);line-height:1.8;box-shadow:0 5px 0 var(--line)}
.bubble .minijar{width:clamp(70px,10vw,130px);height:auto}
.bubble .speak{position:absolute;top:8px;left:8px;width:36px;height:36px}
.ok{border-color:var(--leaf)!important;background:#e4f6ec!important;box-shadow:0 5px 0 var(--leaf)!important}
.hint{border-color:#e9b300!important;background:var(--hint)!important;animation:glow 1s ease-in-out infinite!important}
.no{animation:shake .4s}

/* rain */
.rain{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#e7f5fc,#fdfaf0 70%,#f3d9a4)}
.rain .ask{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:2px 18px 6px;font-weight:800;font-size:clamp(1rem,.9rem + .7vw,1.5rem);box-shadow:0 4px 0 var(--line);white-space:nowrap;z-index:3;display:flex;gap:10px;align-items:center}
.rain .ask b{font-family:var(--read);color:var(--pink);font-size:1.4em;line-height:1}
.drop{position:absolute;top:0;min-width:clamp(92px,9vw + 50px,170px);padding:10px 12px 18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#ffffff,#d7efff 40%,#8fd0f4);border:3px solid #5fb4e6;font-family:var(--read);font-weight:700;font-size:clamp(1.3rem,1rem + 1.2vw,2.2rem);text-align:center;touch-action:manipulation;will-change:transform;box-shadow:0 6px 10px -4px #1d2b4540}
.drop.pop{animation:popout .35s forwards;pointer-events:none}
.drop.no{animation:shakeY .4s}
.drop.hint{background:radial-gradient(circle at 35% 30%,#fff,#fff3b8 50%,#ffd84a)!important}
.rain .bucket{position:absolute;bottom:8px;right:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.rain .bucket span{background:#fff;border-radius:12px;padding:0 10px 4px;font-family:var(--read);font-weight:700;color:var(--leaf);box-shadow:0 3px 0 var(--line)}
.raingrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:70px 16px 16px;position:relative;z-index:2}
.raingrid .drop{position:static}

/* gaps */
.sentcard{background:#fff;border-radius:22px;padding:10px 18px 14px;font-family:var(--read);font-size:clamp(1.35rem,1rem + 1.6vw,2.4rem);line-height:2.1;text-align:center;box-shadow:0 5px 0 var(--line);width:min(900px,100%)}
.gap{display:inline-block;min-width:3.6em;border-bottom:4px dashed #9fb3c4;text-align:center;color:var(--leaf);font-weight:700;line-height:1.5;border-radius:10px 10px 0 0}
.gap.cur{border-bottom-color:var(--pink);background:#fde7f0;animation:glow 1.4s ease-in-out infinite}
.gap.over{background:#e4f6ec}
.stones{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stone{background:#e9edf0;border:4px solid #b9c3cb;border-radius:46% 54% 50% 50%/56% 50% 50% 44%;padding:8px 22px 14px;font-family:var(--read);font-weight:700;font-size:clamp(1.25rem,1rem + 1.2vw,2.1rem);touch-action:none;cursor:grab;box-shadow:0 5px 0 #b9c3cb}
.stone.gone{visibility:hidden}
.ghost{opacity:.95;transition:none!important;animation:none!important}
.lifting{opacity:.35}

/* sort */
.balloon{position:relative;background:#fff;border:4px solid var(--line);border-radius:28px;padding:6px 34px 14px;font-family:var(--read);font-weight:700;font-size:clamp(2.6rem,2rem + 3vw,5rem);box-shadow:0 6px 0 var(--line);touch-action:none;cursor:grab;animation:float 2.4s ease-in-out infinite}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(760px,100%)}
.basket{background:#fff4dd;border:4px solid #e6c98d;border-radius:14px 14px 40px 40px;padding:8px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:clamp(130px,22vh,240px);background-image:repeating-linear-gradient(45deg,transparent 0 12px,#f1dcae55 12px 18px)}
.basket .lt{font-family:var(--read);font-size:clamp(2.6rem,2rem + 2vw,4.4rem);line-height:1.3;font-weight:700;color:var(--pink)}
.basket small{font-weight:800;color:#8a6a1c;font-size:clamp(.9rem,.8rem + .4vw,1.2rem)}
.basket .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-family:var(--read);font-size:clamp(.95rem,.85rem + .4vw,1.3rem);font-weight:700;color:var(--leaf)}
.basket.over{background-color:#e4f6ec;border-color:var(--leaf)}

/* order */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(900px,100%)}
.slot{border:4px dashed #9fb3c4;border-radius:16px;aspect-ratio:16/11;position:relative;display:grid;place-items:center;background:#ffffffb0;overflow:hidden}
.slot>b{font-size:clamp(1.5rem,1.2rem + 1vw,2.4rem);color:#9fb3c4}
.slot.cur{border-color:var(--pink)}
.slot.over{background:#e4f6ec;border-color:var(--leaf)}
.slot .scene{border-radius:0;aspect-ratio:auto;height:100%;box-shadow:none}
.slot .n{position:absolute;top:3px;right:4px;background:var(--sun);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:.85rem;font-weight:800;z-index:1}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(900px,100%)}
@media (min-width:900px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ecard{background:#fff;border:4px solid var(--line);border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:4px;font-family:var(--read);font-weight:700;font-size:clamp(.95rem,.85rem + .5vw,1.35rem);line-height:1.7;text-align:center;touch-action:none;cursor:grab;box-shadow:0 5px 0 var(--line)}
.ecard .scene{border-radius:14px;box-shadow:none}
.ecard.gone{visibility:hidden}

/* train scene */
.train .wagon .full{opacity:0;transition:opacity .3s}
.train .wagon.on .full{opacity:1}
.train .wagon.on .empty{opacity:0}
.train .smoke circle{transform-box:fill-box;transform-origin:center;animation:puff 1.4s linear infinite}
.train .wheel{transform-box:fill-box;transform-origin:center}
.train svg.go .trainmove{animation:depart 3.2s ease-in-out}
.train svg.go .wheel{animation:spin .35s linear infinite}
.train svg.happy .spark{opacity:1}
.scenebox.hero-top .hero-on{top:6%;bottom:auto;right:17%;height:36%}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.9}100%{transform:translate(-16px,-40px) scale(1.5);opacity:0}}
@keyframes depart{0%{transform:translateX(0)}45%{transform:translateX(-360px)}45.1%{transform:translateX(360px)}100%{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(-360deg)}}

/* review games */
.slotcard{background:#fff;border-radius:26px;padding:14px 20px 18px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,100%)}
.slotcard.wide{width:min(900px,100%)}
.picbox{width:clamp(110px,22vh,190px);aspect-ratio:1;border-radius:22px;background:#f2f8fb;display:grid;place-items:center;padding:8px}
.picbox .pic{width:100%;height:100%}
.example{margin:0;font-family:var(--read);font-weight:700;font-size:clamp(1.15rem,1rem + 1vw,1.8rem);color:var(--ink-soft);display:flex;gap:10px;align-items:center;line-height:1.8;background:#f2f8fb;border-radius:14px;padding:2px 14px 6px}
.slotline{margin:0;font-family:var(--read);font-weight:700;font-size:clamp(2.2rem,1.6rem + 3vw,4.2rem);line-height:1.7;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.slotcard.wide .slotline{font-size:clamp(1.4rem,1.1rem + 1.8vw,2.6rem)}
.slot-in{display:inline-grid;place-items:center;min-width:1.3em;min-height:1.3em;border:4px dashed var(--pink);border-radius:16px;background:#fde7f0;color:var(--leaf);padding:0 .15em;line-height:1.3;animation:glow 1.4s ease-in-out infinite}
.slotcard.wide .slot-in{min-width:4em}
.slot-in.over{background:#e4f6ec;border-color:var(--leaf)}
.slot-in.filled{border-style:solid;border-color:var(--leaf);background:#e4f6ec;animation:none}
.slotline.whole span{color:var(--leaf);animation:pop .35s}
.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ltile{background:#fff;border:4px solid var(--line);border-radius:20px;font-family:var(--read);font-weight:700;touch-action:none;cursor:grab;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;line-height:1.4}
.ltile.letter{min-width:clamp(76px,9vw,110px);min-height:clamp(76px,9vw,110px);font-size:clamp(2.4rem,1.8rem + 2.6vw,3.8rem)}
.ltile.syl{min-width:clamp(96px,10vw,140px);padding:4px 16px 10px;font-size:clamp(1.9rem,1.5rem + 2vw,3rem)}
.ltile.word{padding:4px 22px 10px;font-size:clamp(1.4rem,1.1rem + 1.6vw,2.4rem)}
.ltile.gone{visibility:hidden}
.bigspeak{display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(120px,18vh,170px);aspect-ratio:1;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;font-size:1.2rem;justify-content:center;box-shadow:0 7px 0 var(--pink-d);animation:breathe 2s ease-in-out infinite}
.bigspeak .ico{width:46%;height:auto}
.bigspeak:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-d)}
.wordopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(820px,100%)}
@media (max-width:520px){.wordopts{grid-template-columns:1fr}}
.wordopt{background:#fff;border:4px solid var(--line);border-radius:22px;padding:6px 10px 12px;font-family:var(--read);font-weight:700;font-size:clamp(1.8rem,1.4rem + 2vw,3rem);box-shadow:0 5px 0 var(--line)}

.scenebox.hero-left .hero-on{right:auto;left:3%}
/* school bag scene */
.schoolsc .bitem{opacity:0;transition:opacity .3s}
.schoolsc .bitem.on{opacity:1}
.schoolsc .bell{transform-box:fill-box;transform-origin:50% 0}
.schoolsc svg.ring .bell{animation:ring .18s ease-in-out 12 alternate}
.schoolsc .door{transform-box:fill-box;transform-origin:0 50%;transition:transform 1s .8s}
.schoolsc svg.happy .door{transform:scaleX(.12)}
.schoolsc svg.happy .spark{opacity:1}
@keyframes ring{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.hero-pic{padding:4px}
.hero-pic>svg,.duo>svg{height:100%;width:auto}
.duo{display:flex;height:100%;justify-content:center;gap:2px}
/* poem */
.poem{background:#fff;border-radius:24px;padding:10px 14px;box-shadow:0 5px 0 var(--line);width:min(900px,100%);display:flex;flex-direction:column;gap:4px}
.verse{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--read);font-weight:700;font-size:clamp(1.1rem,.85rem + 1.5vw,2.1rem);line-height:2;padding:2px 10px;border-radius:14px;text-align:center;transition:opacity .3s,background .3s}
@media (max-width:520px){.verse{grid-template-columns:1fr;gap:0}}
.verse.now{background:#fff6cc}
.verse.later{opacity:.35}
.verse.done{color:var(--leaf)}
.verse .slot-in{min-width:3.4em;font-size:.95em}
/* classroom */
.classroom{width:min(820px,100%,calc((100vh - 280px) * 1.6));border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--line);flex:none}
.classroom svg{display:block;width:100%;height:auto}
.classroom [data-k]{cursor:pointer}
.classroom [data-k].found{filter:drop-shadow(0 0 5px #2f9e62) drop-shadow(0 0 3px #2f9e62)}
.classroom [data-k].hint{filter:drop-shadow(0 0 7px #ffb800) drop-shadow(0 0 3px #ffb800)}
.classroom [data-k].nope{animation:nope .35s}
@keyframes nope{50%{opacity:.35}}
/* paragraph */
.paraslots,.strips{display:flex;flex-direction:column;gap:7px;width:min(900px,100%)}
.pslot{display:flex;gap:10px;align-items:center;min-height:46px;border:3px dashed #9fb3c4;border-radius:14px;padding:3px 10px;background:#ffffffb0;font-family:var(--read);font-weight:700;font-size:clamp(1rem,.85rem + .8vw,1.5rem);line-height:1.8}
.pslot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.pslot.cur{border-color:var(--pink)}
.pslot.over{background:#e4f6ec;border-color:var(--leaf)}
.pslot.ok{border-style:solid}
.strip{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:16px;padding:5px 12px;font-family:var(--read);font-weight:700;font-size:clamp(1rem,.85rem + .8vw,1.5rem);line-height:1.8;box-shadow:0 4px 0 var(--line);touch-action:none;cursor:grab;text-align:start}
.strip .speak{width:36px;height:36px}
.strip.gone{display:none}

/* overlays */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:1rem;max-width:min(92vw,520px);text-align:center;z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:#1d2b45aa;display:grid;place-items:center;z-index:80;padding:16px}
.sheet{background:var(--paper);border-radius:28px;width:min(620px,100%);max-height:90vh;overflow-y:auto;padding:22px 20px 24px;display:flex;flex-direction:column;gap:14px;animation:pop .3s}
.sheet h3{margin:0;font-size:clamp(1.3rem,1.1rem + 1vw,2rem);font-weight:800;text-align:center}
.sheet h4{margin:0;font-size:1.05rem;font-weight:800;color:var(--pink)}
.center{text-align:center}
.win-hero{height:clamp(140px,24vh,240px);display:flex;justify-content:center}
.win-hero svg{height:100%;width:auto;animation:jump .6s ease-in-out 3}
.rewards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.reward{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 16px 6px;font-weight:800;font-size:1.4rem;box-shadow:0 4px 0 var(--line)}
.reward svg{width:30px;height:30px}
.friend{width:min(240px,70vw);margin:0 auto;border-radius:24px;overflow:hidden;border:6px solid var(--sun);box-shadow:0 8px 0 var(--sun-d);animation:flipIn .8s}
.friend .scene{border-radius:0;box-shadow:none}
.friend p{margin:0;background:var(--sun);text-align:center;font-family:var(--read);font-weight:700;font-size:1.3rem;padding-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.row input[type=range]{width:50%}
.switch{width:56px;height:32px;border-radius:999px;background:#cfd8e0;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{transform:translateX(-24px)}
.guide{margin:0;padding-inline-start:20px;font-family:var(--read);line-height:1.9;font-size:1rem;user-select:text}
.clips{font-family:var(--read);font-size:.95rem;line-height:1.8;background:#f2f6f8;border-radius:12px;padding:8px 12px;max-height:200px;overflow-y:auto;user-select:text}
.clips div{display:flex;gap:10px}
.clips code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;color:var(--ink-soft);direction:ltr;flex:none;padding-top:3px}
.btn{background:#eef3f6;border-radius:14px;padding:6px 16px 9px;font-weight:700}
.btn.warn{background:#fde7f0;color:var(--pink-d)}
.wardrobe{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:480px){.wardrobe{grid-template-columns:1fr}}
.wardrobe .big{height:220px;display:flex;justify-content:center;background:radial-gradient(circle,#fff 40%,#e7f5fc 70%);border-radius:24px;padding:8px}
.wardrobe .big svg{height:100%;width:auto}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.item svg.thumb{width:64px;height:48px}
.item .price{display:flex;align-items:center;gap:3px;font-size:.9rem;color:var(--sun-d)}
.item .price svg{width:16px;height:16px}
.item.on{border-color:var(--leaf);background:#e4f6ec}
.item.locked{opacity:.6}
.swap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.fcard{border-radius:16px;background:#eef3f6;border:3px dashed #c9d5de;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--read);font-weight:700;font-size:.9rem;text-align:center;color:#9aa8b5;overflow:hidden;padding:4px}
.fcard .q{font-size:2.4rem;font-family:var(--display)}
.fcard.got{background:#fff;border:4px solid var(--sun);color:var(--ink);padding:0 0 6px;justify-content:flex-start}
.fcard.got .scene{border-radius:0;aspect-ratio:1/1;box-shadow:none}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:85;pointer-events:none;border-radius:2px}

@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes bump{50%{transform:scale(1.3)}}
@keyframes walk{to{transform:translateY(-6px) rotate(4deg)}}
@keyframes hop{to{transform:translateY(-12px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes shakeY{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
@keyframes glow{50%{box-shadow:0 0 0 8px #ffe58aaa}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
@keyframes float{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes flipIn{0%{transform:rotateY(90deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.still *,body.still *::before,body.still *::after{animation:none!important;transition:none!important}
</style>

<body>


<div id="app">
  <section id="sTitle" class="screen" hidden>
    <div class="title-art" id="titleArt"></div>
    <h1 class="logo">قِرَاءَتِي</h1>
    <p class="sub">مُغَامَرَةُ الْقِرَاءَةِ — الصَّفُّ الثَّانِي الِابْتِدَائِيُّ</p>
    <span class="ribbon">المنهج العراقي · الطبعة السابعة عشرة ٢٠٢٥</span>
    <div style="height:14px"></div>
    <button class="btn3d" id="startBtn"></button>
    <p class="fine">مجانية للأطفال والأهل والمعلمين، دون تسجيل ودون إعلانات</p>
  </section>

  <section id="sHero" class="screen" hidden>
    <h1>اخْتَرْ بَطَلَكَ</h1>
    <div class="picks">
      <button class="pick" data-h="boy" id="pickBoy"></button>
      <button class="pick" data-h="girl" id="pickGirl"></button>
    </div>
  </section>

  <section id="sWorld" class="screen" hidden>
    <div class="hud">
      <button class="rb avbtn" id="wardBtn" aria-label="خزانة البطل"></button>
      <button class="rb" id="albumBtn" aria-label="ألبوم الأصدقاء"></button>
      <h2>عَالَمُ الْقِرَاءَةِ</h2>
      <div class="starpill"></div>
      <button class="rb gear" aria-label="الإعدادات ودليل الأهل"></button>
    </div>
    <div id="worldScroll"><div class="world" id="world"></div></div>
  </section>

  <section id="sHub" class="screen" hidden>
    <div class="hud">
      <button class="rb" id="hubHome" aria-label="عالم القراءة"></button>
      <h2 id="hubTitle">مُهِمَّةُ الْغُرَابِ الْعَطْشَانِ</h2>
      <div class="starpill"></div>
      <button class="rb gear" aria-label="الإعدادات ودليل الأهل"></button>
    </div>
    <div class="stage">
      <div class="scenebox" id="sceneBox"></div>
      <div class="panel" id="hubPanel"></div>
    </div>
  </section>

  <section id="sPlay" class="screen" hidden>
    <div class="playtop">
      <button class="rb" id="playBack" aria-label="رجوع إلى المهمة"></button>
      <div class="instr" id="instr"></div>
      <button class="rb" id="sayBtn" aria-label="أعد التعليمة"></button>
      <div class="mini-av" id="miniAv"></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="arena" id="arena"></div>
  </section>
</div>
<div id="toast" role="status"></div>
<div id="overlay" class="overlay" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

/* ================= icons ================= */
const I={
 home:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
 back:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
 speak:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 gear:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
 play:'<svg class="ico" viewBox="0 0 24 24"><path d="M17 4.5v15L5 12Z" fill="currentColor"/></svg>',
 album:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" fill="#ffd166"/><circle cx="9" cy="10" r="2.4" fill="#e2367a" stroke="none"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>',
 star:(on=1)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8Z" fill="${on?'#f7b731':'#d5dee6'}" stroke="${on?'#c98f12':'#c2ccd5'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
 pebble:'<svg viewBox="0 0 54 46" aria-hidden="true"><path d="M6 28 C4 14 18 4 30 5 C44 6 52 18 48 30 C45 40 30 43 20 41 C11 39 7 35 6 28Z" fill="#a3a9af" stroke="#6b7177" stroke-width="2.5"/><path d="M15 17 C19 12 25 10 30 11" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></svg>'
};
const RI=[
 '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e2367a"/><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Tahoma">؟</text></svg>',
 '<svg viewBox="0 0 24 24"><path d="M12 2 C8 8 5 11 5 15 a7 7 0 0 0 14 0 C19 11 16 8 12 2Z" fill="#3f9fde"/><path d="M9 15 a3 3 0 0 0 3 3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
 '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="3" fill="#fff" stroke="#1d2b45" stroke-width="1.6"/><path d="M8 14 h8" stroke="#e2367a" stroke-width="2.4" stroke-dasharray="2 2"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M3 10 h18 l-2 10 H5Z" fill="#e6c98d" stroke="#8a6a1c" stroke-width="1.4"/><path d="M7 10 C7 4 17 4 17 10" stroke="#8a6a1c" stroke-width="1.8" fill="none"/></svg>',
 '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="9" height="7" rx="1.5" fill="#f7b731"/><rect x="13" y="4" width="9" height="7" rx="1.5" fill="#3f9fde"/><rect x="2" y="13" width="9" height="7" rx="1.5" fill="#2f9e62"/><rect x="13" y="13" width="9" height="7" rx="1.5" fill="#e2367a"/></svg>'
];
$$('.gear').forEach(b=>b.innerHTML=I.gear);
$('#hubHome').innerHTML=I.home;$('#playBack').innerHTML=I.back;$('#sayBtn').innerHTML=I.speak;$('#albumBtn').innerHTML=I.album;
$('#startBtn').innerHTML=I.play+'ابْدَأِ الْمُغَامَرَةَ';

/* ================= saved progress (this device only) ================= */
const KEY='qiraati2-game-v1';
const P={sound:true,rate:.85,still:false,hero:null,stars:0,owned:[],wear:[],missions:{},album:[],seen:{}};
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
document.body.classList.toggle('still',!!P.still);

let voice=null,warned=false,current=null,sayToken=0,pendingFin=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices().filter(x=>/^ar/i.test(x.lang));voice=v.find(x=>/google/i.test(x.name))||v.find(x=>/SA|EG|IQ/i.test(x.lang))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// an interrupted sound still calls its "done" step, so a game never waits forever
function hush(){sayToken++;const f=pendingFin;pendingFin=null;try{speechSynthesis.cancel()}catch(e){}if(current){try{current.pause()}catch(e){}current=null}if(f)setTimeout(f,0)}
function say(id,done){
  const text=CLIPS.get(id)||id;hush();let fired=false;
  const fin=()=>{if(fired)return;fired=true;if(pendingFin===fin)pendingFin=null;done&&done()};
  pendingFin=fin;
  if(!P.sound){setTimeout(fin,300);return}
  const rid=recordedFor(id,text);
  if(rid){const my=sayToken;
    clipURL(rid).then(u=>{if(my!==sayToken)return;current=player;player.onended=fin;player.onerror=()=>tts(text,fin);player.src=u;const pr=player.play();if(pr)pr.catch(()=>tts(text,fin))}).catch(()=>tts(text,fin));
    return}
  tts(text,fin);
}
/* one shared audio player, unlocked by the child's first touch (iPad/iPhone Safari needs this);
   clips are read into memory as blobs, so they also play from the offline cache */
const player=new Audio();player.preload='auto';
const blobs=new Map();
function clipURL(rid){
  if(blobs.has(rid))return blobs.get(rid);
  const p=fetch('audio/'+rid+'.mp3').then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>URL.createObjectURL(b));
  p.catch(()=>blobs.delete(rid));blobs.set(rid,p);return p;
}
let unlocked=false;
function unlockAudio(){
  if(ac&&ac.state==='suspended')ac.resume();
  if(unlocked)return;unlocked=true;
  clipURL('silence').then(u=>{if(player.src&&!player.paused)return;player.src=u;const pr=player.play();if(pr)pr.catch(()=>{unlocked=false})}).catch(()=>{unlocked=false});
}
window.addEventListener('pointerdown',unlockAudio,true);
window.addEventListener('keydown',unlockAudio,true);

// warm the clip cache in the background, a few at a time
setTimeout(()=>{const ids=[...RECORDED];let i=0;const next=()=>{if(i>=ids.length)return;Promise.all(ids.slice(i,i+4).map(id=>clipURL(id).catch(()=>{}))).then(()=>{i+=4;setTimeout(next,60)})};next()},2500);
// the same words appear in several games: any clip whose exact text was recorded once reuses that file
let TEXT2REC=null;
function recordedFor(id,text){if(RECORDED.has(id))return id;if(!TEXT2REC){TEXT2REC=new Map();CLIPS.forEach((t,k)=>{if(RECORDED.has(k)&&!TEXT2REC.has(t))TEXT2REC.set(t,k)})}return TEXT2REC.get(text)||null}
function tts(text,fin){
  if(!('speechSynthesis' in window)){setTimeout(fin,700);noVoice();return}
  if(!voice)pickVoice();
  const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'ar-SA';if(voice)u.voice=voice;u.rate=P.rate;u.onend=fin;u.onerror=fin;
  setTimeout(fin,2500+text.length*160/P.rate);
  try{speechSynthesis.speak(u)}catch(e){fin()}
  if(!voice)setTimeout(()=>{pickVoice();if(!voice)noVoice()},900);
}
function noVoice(){if(warned)return;warned=true;toast('لا يوجد صوت عربي على هذا الجهاز. اللعبة تعمل، وستُضاف تسجيلات صوتية قريباً.',5200)}
const sayP=id=>new Promise(r=>say(id,r));

let ac;
function sfx(kind){
  if(!P.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime;
    const note=(f,s,d,type='sine',v=.16)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t+s);g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(v,t+s+.02);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);o.connect(g).connect(ac.destination);o.start(t+s);o.stop(t+s+d+.05);return o};
    if(kind==='ok'){note(660,0,.25);note(990,.09,.3)}
    else if(kind==='no'){note(220,0,.25,'triangle',.12);note(185,.1,.3,'triangle',.12)}
    else if(kind==='pop'){const o=note(500,0,.15,'sine',.18);o.frequency.exponentialRampToValueAtTime(1100,t+.12)}
    else if(kind==='star'){[523,659,784,1046].forEach((f,i)=>note(f,i*.09,.3))}
    else if(kind==='win'){[523,659,784,659,784,1046].forEach((f,i)=>note(f,i*.12,.35,'triangle',.14))}
    else if(kind==='bell'){for(let i=0;i<10;i++){note(1568,i*.085,.12,'triangle',.09);note(2093,i*.085+.04,.1,'sine',.06)}}
    else if(kind==='whoosh'){const o=note(300,0,.35,'sawtooth',.04);o.frequency.exponentialRampToValueAtTime(900,t+.3)}
    else if(kind==='splash'){
      const len=ac.sampleRate*.45|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
      const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=1400;g.gain.value=.35;s.connect(f).connect(g).connect(ac.destination);s.start();
      const o=note(420,0,.25,'sine',.14);o.frequency.exponentialRampToValueAtTime(140,t+.22);
    }
  }catch(e){}
}

/* ---- school games ---- */
function gPoem(c,poem){
  let k=0;const T=tries();
  c.inner.innerHTML='';
  const box=el('div','poem');
  poem.forEach((v,i)=>box.insertAdjacentHTML('beforeend',`<div class="verse" data-i="${i}"><span class="h">${v.a}</span><span class="h">${v.b}</span></div>`));
  const tiles=el('div','tiles');
  c.inner.append(box,tiles);
  function verse(){
    T.reset();c.progress(k/poem.length);tiles.innerHTML='';
    const v=poem[k];const row=box.children[k];
    box.querySelectorAll('.verse').forEach((r,i)=>{r.classList.toggle('now',i===k);r.classList.toggle('later',i>k)});
    row.scrollIntoView({block:'nearest',behavior:P.still?'auto':'smooth'});
    say(v.id,()=>{ // after hearing the verse, one word goes missing
      if(!c.alive())return;
      const hs=row.querySelectorAll('.h');const hi=v.a.includes(v.gap)?0:1;const h=hs[hi];
      h.innerHTML=h.textContent.replace(v.gap,'<span class="slot-in" aria-label="فراغ"></span>');
      const slot=h.querySelector('.slot-in');
      shuffle(v.opts).forEach(t=>{const b=el('div','ltile word',t);b.setAttribute('role','button');b.dataset.t=t;tiles.append(b);
        const tryIt=()=>{if(c.inner.dataset.lock)return false;
          if(t===v.gap){c.inner.dataset.lock=1;c.good();slot.textContent=t;slot.classList.add('filled');b.classList.add('gone');
            say(v.gid,()=>{if(!c.alive())return;delete c.inner.dataset.lock;h.textContent=(hi?v.b:v.a);row.classList.add('done');k++;k<poem.length?setTimeout(()=>c.alive()&&verse(),300):(box.querySelectorAll('.verse').forEach(r=>r.classList.remove('now','later')),c.win())});return true}
          const r=tiles.querySelector(`.ltile[data-t="${CSS.escape(v.gap)}"]`);T.miss(b,r,v.gid);return false};
        draggable(b,{targets:()=>[slot],onDrop:tryIt,onTap:tryIt})});
    });
  }
  setTimeout(()=>c.alive()&&verse(),2600);
}
function gFind(c){
  const asks=shuffle(CLASS_THINGS).slice(0,6);let k=0;const T=tries();
  c.inner.innerHTML='';
  const q=el('p','qtext');const room=el('div','classroom',classroomSvg());
  c.inner.append(q,room);
  const svg=room.firstElementChild;
  function ask(){
    T.reset();const a=asks[k];c.progress(k/asks.length);
    q.innerHTML=`<button class="speak" aria-label="استمع">${I.speak}</button>${CLIPS.get(a.q)}`;
    q.querySelector('.speak').onclick=()=>say(a.q);
    svg.querySelectorAll('.hint').forEach(g=>g.classList.remove('hint'));
    setTimeout(()=>c.alive()&&say(a.q),k?250:2600);
  }
  svg.querySelectorAll('[data-k]').forEach(g=>g.addEventListener('click',()=>{
    if(c.inner.dataset.lock)return;const a=asks[k];
    if(g.dataset.k===a.k){c.inner.dataset.lock=1;c.good();g.classList.add('found');svg.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));
      say(a.id,()=>{if(!c.alive())return;delete c.inner.dataset.lock;g.classList.remove('found');k++;k<asks.length?ask():c.win()})}
    else{T.miss(null,svg.querySelector(`[data-k="${a.k}"]`),a.q);g.classList.remove('nope');void g.getBoundingClientRect();g.classList.add('nope')}
  }));
  ask();
}
function gStrips(c){
  let filled=0;const T=tries();
  c.inner.innerHTML='';
  const list=el('div','paraslots',PARA.map((_,i)=>`<div class="pslot" data-i="${i}"><span class="n">${ar(i+1)}</span><span class="pt"></span></div>`).join(''));
  const pool=el('div','strips');
  c.inner.append(list,pool);
  const cur=()=>[...list.children].find(s=>!s.dataset.full);
  const mark=()=>[...list.children].forEach(s=>s.classList.toggle('cur',s===cur()));
  shuffle(PARA).forEach(p=>{const s=el('div','strip',`<button class="speak" aria-label="استمع">${I.speak}</button><span>${p.t}</span>`);s.dataset.i=p.i;s.setAttribute('role','button');pool.append(s);
    const sp=s.querySelector('.speak');sp.addEventListener('pointerdown',e=>e.stopPropagation());sp.onclick=e=>{e.stopPropagation();say(p.id)};
    const place=slot=>{if(s.classList.contains('gone')||!slot||slot.dataset.full)return false;
      if(+slot.dataset.i===p.i){c.good();slot.dataset.full=1;slot.querySelector('.pt').textContent=p.t;slot.classList.add('ok');s.classList.add('gone');filled++;c.progress(filled/PARA.length);T.reset();pool.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));mark();
        say(p.id,()=>{if(c.alive()&&filled===PARA.length)c.win()});return true}
      const want=pool.querySelector(`.strip[data-i="${slot.dataset.i}"]`);T.miss(s,want,PARA[+slot.dataset.i].id);return false};
    draggable(s,{targets:()=>[...list.children].filter(x=>!x.dataset.full),onDrop:place,onTap:()=>place(cur())})});
  mark();
}

let zonePts=[];
function layoutWorld(){
  const w=$('#world');if(!w.firstChild)return;const W=w.clientWidth||360;const gap=200,top=50;
  zonePts=ZONES.map((_,i)=>({x:W*(i%2?.3:.7),y:top+i*gap}));

  let d=`M${zonePts[0].x} ${zonePts[0].y+60}`;
  for(let i=1;i<zonePts.length;i++){const a=zonePts[i-1],b=zonePts[i];d+=` C${a.x} ${a.y+150} ${b.x} ${b.y-30} ${b.x} ${b.y+60}`}
  const svg=$('#wpath');svg.setAttribute('viewBox',`0 0 ${W} ${top+ZONES.length*gap}`);
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".7"/><path d="${d}" fill="none" stroke="#e6c98d" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>`;
  const at=P.at!=null?P.at:0;const k=$('#walker');k.style.left=(zonePts[at].x-58)+'px';k.style.top=(zonePts[at].y+118)+'px';
}
function walkTo(i,done){

let hubScene=null,storyRunning=false;

function nextRound(){return MS(MI.id).cleared.findIndex(c=>!c)}
function renderPanel(){
  const m=MS(MI.id);const p=$('#hubPanel');p.innerHTML='';
  p.append(el('div','jarmeter',Array.from({length:8},(_,i)=>`<i class="${i<m.thrown?'in':''}"></i>`).join('')+`<b>${ar(m.thrown)} / ${ar(8)}</b>`));
  const trail=el('div','trail');
  MI.rounds.forEach((r,i)=>{const b=el('button','tok'+(m.cleared[i]?' cleared':'')+(i===nextRound()&&!m.hand?' next':''),MI.icons[i]+`<small>${r.name}</small>`);b.setAttribute('aria-label',r.name);b.onclick=()=>{if(storyRunning)return;sfx('pop');go(MI.id+'-'+(i+1))};trail.append(b)});
  p.append(trail);
  if(m.hand>0){
    const tray=el('div','tray');tray.append(el('div','msg',CLIPS.get(MI.trayId)));
    for(let i=0;i<m.hand;i++){const pb=el('div','peb',MI.token);pb.setAttribute('role','button');pb.setAttribute('aria-label',CLIPS.get(MI.trayId));pb.tabIndex=0;tray.append(pb);
      pb.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')throwToken(pb)};
      draggable(pb,{targets:()=>[hubScene],onDrop:()=>{throwToken(pb,true);return true},onTap:()=>throwToken(pb)})}
    p.append(tray);
  }else if(m.thrown>=8){
    const b=el('button','btn3d green',I.play+'الْعَبِ الْمُهِمَّةَ مِنْ جَدِيدٍ');b.onclick=()=>{P.missions[MI.id]={cleared:[0,0,0,0,0],hand:0,thrown:0,done:m.done};save();showHub()};p.append(b);
  }else{
    const n=nextRound();
    const b=el('button','btn3d',I.play+MI.rounds[n].name);b.onclick=()=>{sfx('whoosh');go(MI.id+'-'+(n+1))};p.append(b);
  }
  const s=el('button','btn','أَعِدِ الْقِصَّةَ');s.onclick=()=>{if(!storyRunning)playStory(token)};p.append(s);
}
function throwToken(pb,dropped){
  const m=MS(MI.id);if(m.hand<=0||pb.dataset.gone||storyRunning)return;pb.dataset.gone=1;
  m.hand--;m.thrown++;save();
  const from=pb.getBoundingClientRect();pb.style.visibility='hidden';
  const tgt=hubScene.target().getBoundingClientRect();
  const fly=el('div','flypeb',MI.token);document.body.append(fly);
  const sx=from.left+from.width/2-20,sy=from.top+from.height/2-17,ex=tgt.left+tgt.width/2-20,ey=tgt.top-10;
  fly.style.left=sx+'px';fly.style.top=sy+'px';sfx('whoosh');
  const peak=Math.min(sy,ey)-90;
  const done=()=>{fly.remove();hubScene.set(m.thrown);hubScene.added(m.thrown);
    if(m.thrown>=8){setTimeout(finale,900)}else{setTimeout(renderPanel,400);if(m.hand===0)setTimeout(()=>say(praise()),300)}};
  if(P.still){done();return}
  fly.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(ex-sx)/2}px,${peak-sy}px) rotate(200deg)`,offset:.5},{transform:`translate(${ex-sx}px,${ey-sy}px) rotate(400deg) scale(.7)`}],{duration:dropped?450:750,easing:'cubic-bezier(.3,.1,.5,1)'}).onfinish=done;
}
async function finale(){
  const my=token;const m=MS(MI.id);const mi=MI;
  const ok=await mi.finale(hubScene,()=>alive(my));if(!ok||!alive(my))return;
  sfx('win');confetti();
  await sleep(600);if(!alive(my))return;
  const first=!m.done;m.done=1;if(!P.album.includes(mi.id))P.album.push(mi.id);

    <p class="center" style="margin:0;font-family:var(--read);font-weight:700;font-size:1.15rem;line-height:1.9">${mi.moral}</p>
    <div class="swap"><button class="btn3d green" id="toWorld">عَالَمُ الْقِرَاءَةِ</button><button class="btn" data-close>ابْقَ هُنَا</button></div>`,true);

async function playStory(my){
  storyRunning=true;const box=$('#sceneBox');
  const line=el('div','sub-line');const skip=el('button','skip','تَخَطَّ');box.append(line,skip);
  const h0=box.querySelector('.hero-on');if(h0)h0.hidden=true;$('#hubPanel').style.opacity=.4;

/* ================= drag helper (drag, or tap as fallback) ================= */
function draggable(node,{targets,onDrop,onTap}){
  node.addEventListener('pointerdown',e=>{
    if(e.button>0)return;e.preventDefault();
    const r=node.getBoundingClientRect();const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
    const hit=ev=>targets().find(x=>{const b=x.getBoundingClientRect();return ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom});
    const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>10){moved=true;ghost=node.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('hint');
        Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:0,zIndex:75,pointerEvents:'none',boxSizing:'border-box'});
        document.body.append(ghost);node.classList.add('lifting')}
      if(moved){ghost.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;const t=hit(ev);targets().forEach(x=>x.classList.toggle('over',x===t))}};
    const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      targets().forEach(x=>x.classList.remove('over'));node.classList.remove('lifting');
      if(!moved){onTap&&onTap();return}
      const t=hit(ev);const ok=t?onDrop(t):false;
      if(ok||P.still){ghost.remove()}else{const a=ghost.animate([{transform:ghost.style.transform},{transform:'translate(0,0)'}],{duration:220});a.onfinish=()=>ghost.remove()}};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
}

function gSlot(c,items,o){
  let k=0;const T=tries();
  function show(){
    T.reset();const it=items[k];c.progress(k/items.length);
    c.inner.innerHTML='';
    const card=el('div','slotcard'+(o.tile==='word'?' wide':''));
    if(it.icon)card.insertAdjacentHTML('beforeend',`<div class="picbox">${pic(it.icon)}</div>`);
    if(it.picHtml)card.insertAdjacentHTML('beforeend',`<div class="picbox hero-pic">${it.picHtml}</div>`);
    if(it.ex)card.insertAdjacentHTML('beforeend',`<p class="example"><button class="speak" data-say="${it.exId}" aria-label="استمع">${I.speak}</button>${it.ex}</p>`);
    const line=el('p','slotline',`<span class="frag">${it.pre}</span><span class="slot-in" aria-label="فراغ"></span><span class="frag">${it.post}</span>`);
    card.append(line);
    const tiles=el('div','tiles');
    c.inner.append(card,tiles);
    const slot=line.querySelector('.slot-in');
    shuffle(it.opts).forEach(t=>{const b=el('div','ltile '+o.tile,t);b.setAttribute('role','button');b.dataset.t=t;tiles.append(b);
      const tryIt=()=>{if(c.inner.dataset.lock)return false;
        if(t===it.ok){c.inner.dataset.lock=1;c.good();slot.textContent=t;slot.classList.add('filled');b.classList.add('gone');
          setTimeout(()=>{line.classList.add('whole');line.innerHTML=`<span>${it.word}</span>`},450);
          say(it.id,()=>{if(!c.alive())return;delete c.inner.dataset.lock;k++;k<items.length?show():c.win()});return true}
        const r=tiles.querySelector(`.ltile[data-t="${CSS.escape(it.ok)}"]`);T.miss(b,r,it.id);return false};
      draggable(b,{targets:()=>[slot],onDrop:tryIt,onTap:tryIt})});
    if(k||o.tile==='word')setTimeout(()=>{if(c.alive()&&it.exId)say(it.exId)},k?300:2600);
    card.querySelectorAll('[data-say]').forEach(s=>s.onclick=()=>say(s.dataset.say));
  }
  show();
}
function gListen(c){
  const rounds=shuffle(LISTEN).slice(0,6);let k=0;const T=tries();
  function show(){
    T.reset();const set=rounds[k];const target=set[Math.random()*set.length|0];c.progress(k/rounds.length);
    c.inner.innerHTML='';
    const big=el('button','bigspeak',I.speak+'<span>اسْمَعْ</span>');big.onclick=()=>say(target.id);
    const opts=el('div','wordopts');
    shuffle(set).forEach(w=>{const b=el('button','wordopt',w.w);b.dataset.id=w.id;opts.append(b);
      b.onclick=()=>{if(c.inner.dataset.lock)return;
        if(w===target){c.inner.dataset.lock=1;c.good(b);say(w.id,()=>{if(!c.alive())return;delete c.inner.dataset.lock;k++;k<rounds.length?show():c.win()})}
        else{const r=opts.querySelector(`[data-id="${target.id}"]`);T.miss(b,r,target.id)}}});
    c.inner.append(big,opts);
    setTimeout(()=>c.alive()&&say(target.id),k?300:2400);
  }
  show();
}

/* tries: no losing — after two misses the right answer glows and is read aloud */
function tries(){let n=0;return{reset(){n=0},get n(){return n},miss(node,right,rightId){n++;sfx('no');if(node){node.classList.remove('no');void node.offsetWidth;node.classList.add('no')}
  if(n>=2&&right){right.classList.add('hint');say(rightId)}else say('again')}}}


/* ---- 1. choose ---- */
function gChoose(c){
  let qi=0;const T=tries();
  function ask(){
    T.reset();const Q=QS[qi];c.progress(qi/QS.length);
    c.inner.innerHTML=`<p class="qtext"><button class="speak" data-say="${Q.q}" aria-label="استمع">${I.speak}</button>${CLIPS.get(Q.q)}</p>
     <div class="bubbles">${shuffle(Q.o).map(([id,j,ok])=>`<button class="bubble" data-ok="${ok}" data-id="${id}"><span class="speak" data-say="${id}">${I.speak}</span>${j!=null?miniJar(j):''}<span>${CLIPS.get(id)}</span></button>`).join('')}</div>`;
    if(qi)setTimeout(()=>c.alive()&&say(Q.q),300);
    c.inner.onclick=e=>{
      const s=e.target.closest('[data-say]');if(s){e.stopPropagation();say(s.dataset.say);return}
      const b=e.target.closest('.bubble');if(!b||c.inner.dataset.lock)return;
      if(b.dataset.ok==='1'){c.inner.dataset.lock=1;c.good(b);say(praise());
        setTimeout(()=>{if(!c.alive())return;delete c.inner.dataset.lock;qi++;qi<QS.length?ask():c.win()},1300)}
      else{const r=c.inner.querySelector('.bubble[data-ok="1"]');T.miss(b,r,r.dataset.id)}};
  }
  ask();
}

/* ---- 2. tanween rain ---- */
function gRain(c){
  c.inner.remove();
  const box=el('div','rain');c.arena.append(box);
  const ask=el('div','ask');const bucket=el('div','bucket');box.append(ask,bucket);
  const phases=shuffle([0,1,2]);let ph=0,got=0;const need=2;const T=tries();let drops=[];let raf=0,last=0,spawnT=0,paused=true;
  const total=phases.length*need;let caught=0;
  function setPhase(){
    T.reset();got=0;drops.forEach(d=>d.el.remove());drops=[];
    const k=phases[ph];ask.innerHTML=`الْتَقِطْ: ${TAN_NAMES[k]} <b>${TAN_MARK[k]}</b>`;
    paused=true;const myPh=ph;say('rain-ask-'+(k+1),()=>{if(ph===myPh)paused=false});
    setTimeout(()=>{if(ph===myPh)paused=false},4000);
    if(P.still)staticGrid();
  }
  function pickWord(){const k=phases[ph];const tgt=Math.random()<.5;const pool=tgt?TW[k]:TW[[0,1,2].filter(x=>x!==k)[Math.random()*2|0]];return pool[Math.random()*pool.length|0]}
  function spawn(){
    const H=box.clientHeight,W=box.clientWidth;const w=pickWord();
    const d=el('button','drop',w.w);box.append(d);
    const dw=d.offsetWidth;const lanes=Math.max(2,Math.floor((W-20)/(dw+12)));const used=drops.filter(x=>x.y<140).map(x=>x.lane);
    let lane=Math.random()*lanes|0;for(let t=0;t<lanes&&used.includes(lane);t++)lane=(lane+1)%lanes;
    const x=10+lane*((W-20-dw)/Math.max(1,lanes-1));
    const o={el:d,y:-90,lane,v:H/(9+Math.random()*2.5),w};d.style.left=x+'px';d.style.transform=`translateY(${o.y}px)`;
    if(T.n>=2&&w.k===phases[ph])d.classList.add('hint');
    d.addEventListener('pointerdown',e=>{e.preventDefault();tap(o)});drops.push(o);
  }
  function tap(o){
    if(o.done||paused&&!P.still)return;const k=phases[ph];
    if(o.w.k===k){o.done=1;c.good();o.el.classList.add('pop');say(o.w.id);setTimeout(()=>o.el.remove(),350);drops=drops.filter(x=>x!==o);
      got++;caught++;c.progress(caught/total);bucket.insertAdjacentHTML('beforeend',`<span>${o.w.w}</span>`);
      if(got>=need){paused=true;setTimeout(()=>{if(!c.alive())return;ph++;if(ph<phases.length){bucket.innerHTML='';setPhase()}else{cancelAnimationFrame(raf);c.win()}},900)}}
    else{T.miss(o.el,null,null);if(T.n>=2){box.querySelectorAll('.drop').forEach(x=>{const ow=drops.find(d=>d.el===x)||x._o;if(ow&&ow.w.k===k)x.classList.add('hint')})}}
  }
  function loop(t){
    if(!c.alive()){drops.forEach(d=>d.el.remove());return}
    const dt=Math.min(.05,(t-(last||t))/1000);last=t;
    if(!paused){spawnT-=dt;if(spawnT<=0&&drops.length<4){spawn();spawnT=1.6}
      const H=box.clientHeight;
      drops.forEach(o=>{o.y+=o.v*dt;o.el.style.transform=`translateY(${o.y}px)`;if(o.y>H+10){o.el.remove();o.gone=1}});
      drops=drops.filter(o=>!o.gone);}
    raf=requestAnimationFrame(loop);
  }
  function staticGrid(){ // reduced-motion version: words stand still, same choice
    box.querySelectorAll('.raingrid').forEach(g=>g.remove());
    const g=el('div','raingrid');const k=phases[ph];
    const words=shuffle([...shuffle(TW[k]).slice(0,3),...shuffle([...TW[(k+1)%3],...TW[(k+2)%3]]).slice(0,4)]);
    words.forEach(w=>{const d=el('button','drop',w.w);const o={el:d,w};d._o=o;d.onclick=()=>tap(o);g.append(d)});box.append(g);
  }
  setPhase();
  if(!P.still)raf=requestAnimationFrame(loop);
}

/* ---- 3. missing words ---- */
function gGaps(c){
  let si=0;const T=tries();let done=0;
  function sentence(){
    const S=GAPS[si];const blanks=S.filter(x=>typeof x==='number');let bi=0;
    c.inner.innerHTML='';
    const card=el('div','sentcard',S.map(x=>typeof x==='number'?`<span class="gap" data-g="${x}">&nbsp;</span>`:x).join(''));
    const stones=el('div','stones');c.inner.append(card,stones);
    function step(){
      T.reset();const g=blanks[bi];card.querySelectorAll('.gap').forEach(x=>x.classList.toggle('cur',+x.dataset.g===g));
      const others=shuffle(GAPW.filter(w=>w.i!==g)).slice(0,2);
      stones.innerHTML='';
      shuffle([GAPW[g],...others]).forEach(w=>{const s=el('div','stone',w.w);s.dataset.i=w.i;s.setAttribute('role','button');stones.append(s);
        const tryIt=()=>{if(s.classList.contains('gone'))return false;
          if(+s.dataset.i===g){c.good();const gp=card.querySelector(`.gap[data-g="${g}"]`);gp.textContent=w.w;gp.classList.remove('cur');s.classList.add('gone');done++;c.progress(done/GAPW.length);
            bi++;if(bi<blanks.length){say(w.id);setTimeout(()=>c.alive()&&step(),500)}
            else say('gap-s'+(si+1),()=>{if(!c.alive())return;si++;si<GAPS.length?sentence():c.win()});
            return true}
          const r=stones.querySelector(`.stone[data-i="${g}"]`);T.miss(s,r,GAPW[g].id);return false};
        draggable(s,{targets:()=>[...card.querySelectorAll('.gap.cur')],onDrop:tryIt,onTap:tryIt})});
    }
    step();
  }
  sentence();
}

/* ---- 4. sort ى / ا ---- */
function gSort(c){
  const W=shuffle([...shuffle(SORTW.filter(w=>!w.k)).slice(0,4),...shuffle(SORTW.filter(w=>w.k)).slice(0,4)]);let wi=0;const T=tries();
  const word=el('div','balloon');word.setAttribute('role','button');
  const bs=el('div','baskets',[['ى','basket-0'],['ا','basket-1']].map(([l,id],k)=>`<button class="basket" data-k="${k}"><span class="lt">${l}</span><small>${CLIPS.get(id)}</small><span class="got"></span></button>`).join(''));
  c.inner.append(word,bs);
  const baskets=()=>[...bs.querySelectorAll('.basket')];
  function next(){T.reset();baskets().forEach(b=>b.classList.remove('hint'));const w=W[wi];word.textContent=w.w;c.progress(wi/W.length);setTimeout(()=>c.alive()&&say(w.id),wi?250:2200)}
  let lock=false;
  const put=b=>{if(lock)return false;const w=W[wi];
    if(+b.dataset.k===w.k){lock=true;c.good(b);b.querySelector('.got').insertAdjacentHTML('beforeend',`<span>${w.w}</span>`);
      setTimeout(()=>{b.classList.remove('ok');lock=false;if(!c.alive())return;wi++;wi<W.length?next():(word.hidden=true,c.win())},650);return true}
    T.miss(b,baskets()[w.k],'basket-'+w.k);return false};
  bs.onclick=e=>{const b=e.target.closest('.basket');if(b)put(b)};
  draggable(word,{targets:baskets,onDrop:put,onTap:()=>say(W[wi].id)});
  next();
}

/* ---- 5. order the story ---- */
function gOrder(c){
  let filled=0;const T=tries();
  const slots=el('div','slots',EVENTS.map((_,i)=>`<div class="slot" data-i="${i}"><span class="n">${ar(i+1)}</span><b>${ar(i+1)}</b></div>`).join(''));
  const cards=el('div','cards');c.inner.append(slots,cards);
  const cur=()=>[...slots.children].find(s=>!s.dataset.full);
  const mark=()=>[...slots.children].forEach(s=>s.classList.toggle('cur',s===cur()));
  shuffle(EVENTS).forEach(e=>{const k=el('div','ecard');k.dataset.i=e.i;k.setAttribute('role','button');k.append(makeScene(e.s,true));k.insertAdjacentHTML('beforeend',`<span>${e.t}</span>`);cards.append(k);
    const place=slot=>{if(k.classList.contains('gone')||!slot||slot.dataset.full)return false;
      if(+slot.dataset.i===e.i){c.good();slot.dataset.full=1;slot.querySelector('b').remove();slot.append(makeScene(e.s,true));k.classList.add('gone');filled++;c.progress(filled/EVENTS.length);T.reset();cards.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));mark();
        say(e.id,()=>{if(c.alive()&&filled===EVENTS.length)c.win()});return true}
      const want=cards.querySelector(`.ecard[data-i="${slot.dataset.i}"]`);T.miss(k,want,EVENTS[+slot.dataset.i].id);return false};
    draggable(k,{targets:()=>[...slots.children].filter(s=>!s.dataset.full),onDrop:place,onTap:()=>place(cur())})});
  mark();
}

/* ================= overlays ================= */
const ov=$('#overlay');
// win windows (modal) close only from their own buttons, so a quick extra tap cannot dismiss them
function openOv(html,modal){ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;ov.hidden=false;ov.dataset.modal=modal?1:''}
function closeOv(){ov.hidden=true;ov.innerHTML='';ov.onclose&&ov.onclose();ov.onclose=null}
ov.addEventListener('click',e=>{if((e.target===ov&&!ov.dataset.modal)||e.target.closest('[data-close]'))closeOv()});
function confetti(){if(P.still)return;const cols=['#e2367a','#f7b731','#2f9e62','#3f9fde','#fff'];
  for(let i=0;i<46;i++){const p=el('div','confetti');p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];document.body.append(p);
    p.animate([{transform:'translateY(0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+60}px) rotate(${Math.random()*720}deg)`}],{duration:1600+Math.random()*1400,delay:Math.random()*300,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>p.remove()}}

function openWardrobe(){
  const draw=()=>{
    ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>خِزَانَةُ الْبَطَلِ</h3>
    <div class="wardrobe"><div class="big">${heroSvg(P.hero,P.wear)}</div>
    <div class="items">${ITEMS.map(it=>{const own=P.owned.includes(it.id),on=P.wear.includes(it.id);
      return `<button class="item ${on?'on':''} ${!own&&P.stars<it.price?'locked':''}" data-id="${it.id}">${itemThumb(it.id)}<span>${it.name}</span>${own?`<small>${on?'تَلْبَسُهُ الْآنَ':'الْبَسْ'}</small>`:`<span class="price">${I.star(1)}${ar(it.price)}</span>`}</button>`}).join('')}</div></div>
    <div class="swap"><button class="btn" id="swapHero">${P.hero==='boy'?'غَيِّرْ إِلَى بِنْتٍ':'غَيِّرْ إِلَى وَلَدٍ'}</button><button class="btn3d small green" data-close>تَمَّ</button></div></div>`;
    ov.hidden=false;
    ov.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.id);
      if(!P.owned.includes(it.id)){if(P.stars<it.price){sfx('no');say('buy-no');toast('تحتاج '+ar(it.price-P.stars)+' نجوم أخرى');return}P.stars-=it.price;P.owned.push(it.id);sfx('star')}
      else sfx('pop');
      if(P.wear.includes(it.id))P.wear=P.wear.filter(x=>x!==it.id);
      else{P.wear=P.wear.filter(x=>(ITEMS.find(y=>y.id===x)||{}).slot!==it.slot);P.wear.push(it.id)}
      save();refreshHud();draw()});
    $('#swapHero').onclick=()=>{P.hero=P.hero==='boy'?'girl':'boy';save();refreshHud();sfx('pop');draw()};
  };
  draw();
  ov.onclose=()=>{if(!$('#sWorld').hidden)buildWorld()};
}

};
